[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tier-graph-reference"
version = "0.1.0"
description = "Reference implementation and executable conformance fixtures for the TIER-Graph API: temporally indexed, evidence-linked derived relations over pluggable temporal grounding profiles."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Hudson de Martim" }]
keywords = [
  "knowledge-graphs",
  "temporal-knowledge-graphs",
  "ontology",
  "provenance",
  "evidence",
  "reference-implementation",
  "conformance-testing",
  "legal-ai",
  "graph-rag",
]
classifiers = [
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: Apache Software License",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.7,<3",
  "pyyaml>=6.0",
  "jsonschema>=4.21",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.111",
  "uvicorn>=0.30",
]
http = [
  "httpx>=0.27",
]
paths = [
  "networkx>=3.3",
]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.21",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "networkx>=3.3",
]

[project.urls]
Homepage = "https://github.com/hmartim/tier-graph-reference"
Specification = "https://github.com/hmartim/tier-graph-api"

[project.scripts]
tier-conformance = "tier_graph_reference.conformance.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tier_graph_reference"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
  "B008",    # FastAPI Depends()/Query() in defaults is idiomatic
  "RUF012",  # Pydantic v2 copies field defaults, so mutable field defaults are safe
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
packages = ["tier_graph_reference"]
mypy_path = "src"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["networkx.*", "yaml.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]
