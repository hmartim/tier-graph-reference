name: reject-private-artifacts

on:
  push:
    branches: [main]
  pull_request:

jobs:
  privacy-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reject private databases, credentials, and env files
        run: python scripts/reject_private_artifacts.py
